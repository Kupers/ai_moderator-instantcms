[description]
text[] = "Нейросетевая модерация текстов: автоматическая проверка комментариев и контента (статей, блогов) на спам, рекламу, оскорбления и мошенничество"
text[] = "Три LLM-бэкенда на выбор в админке: Ollama (локальный или сетевой), YandexGPT (Foundation Models API), любой OpenAI-совместимый endpoint. Настраиваемый порог уверенности, чёрный список слов, жёсткие правила по ссылкам"
text[] = "Четыре режима реакции на спам: жёсткая блокировка (отклонить), снять с публикации, скрыть текст заглушкой, только лог. ЛС-уведомления администратора, журнал проверок, страница тестирования текста. Пост-модерация уже опубликованного, санкции к авторам (карма, бан, предупреждение)"
text[] = "Рекомендуемые модели Ollama: qwen2.5:7b (отличный русский, стабильный JSON), llama3.1:8b (чуть слабее русский). Для слабого железа: qwen2.5:3b, phi4-mini"

[install]
type = "component"
name = "ai_moderator"