[description]
text[] = "Neural-network text moderation: automatic checking of comments and content (articles, blogs) for spam, ads, insults and fraud"
text[] = "Three LLM backends selectable in admin: Ollama (local or networked), YandexGPT (Foundation Models API), any OpenAI-compatible endpoint. Adjustable confidence threshold, word blacklist, hard link rules"
text[] = "Three reaction modes for detected spam: hard block (reject), send to moderation, log only. Administrator PM notifications, check journal, text testing page"
text[] = "Recommended Ollama models: qwen2.5:7b (great Russian, stable JSON output), llama3.1:8b (slightly weaker in Russian). Weak hardware: qwen2.5:3b, phi4-mini"

[install]
type = "component"
name = "ai_moderator"